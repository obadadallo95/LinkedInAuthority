# Firebase App Hosting configuration
# See reference: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  concurrency: 80
  minInstances: 0
  cpu: 1
  memoryMiB: 512

# Environment variables configuration for App Hosting.
# In App Hosting, secrets must reference Cloud Secret Manager resource names in the 'secret' field,
# or we can define them as non-secret environment variables using the 'value' field.
# Since these are credentials/API keys, we bind them to Secret Manager.
env:
  - variable: GEMINI_API_KEY
    secret: lgc_gemini_api_key
  - variable: GITHUB_CLIENT_ID
    secret: lgc_github_client_id
  - variable: GITHUB_CLIENT_SECRET
    secret: lgc_github_client_secret
