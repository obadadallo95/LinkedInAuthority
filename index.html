    <script>
      // Apply Dynamic Meta Tags
      document.addEventListener('DOMContentLoaded', function() {
        var c = window.__LAE_CONTENT__;
        if(c && window.__LAE_LANG__ === 'ar') {
          document.title = c.title;
          
          var descMeta = document.querySelector('meta[name="description"]');
          if (descMeta) descMeta.setAttribute('content', c.description);
          
          var ogTitle = document.querySelector('meta[property="og:title"]');
          if (ogTitle) ogTitle.setAttribute('content', c.ogTitle);
          
          var ogDesc = document.querySelector('meta[property="og:description"]');
          if (ogDesc) ogDesc.setAttribute('content', c.description);

      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="color:red; z-index:9999; position:absolute; top:0; left:0; background:black; padding:20px;">' + e.message + '<br>' + e.filename + ':' + e.lineno + '<br>' + (e.error ? e.error.stack : '') + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="color:red; z-index:9999; position:absolute; top:0; left:0; background:black; padding:20px;">Unhandled Rejection: ' + e.reason + '</div>';
      });
    </script>

    <!-- Clean up any previously registered service workers to prevent cache/CORS script errors -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('Service Worker unregistered successfully');
          }
        }).catch(function(err) {
          console.warn('Error fetching service worker registrations:', err);
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        }).catch(function(err) {
          console.warn('Error clearing caches:', err);
        });
      }
    </script>
