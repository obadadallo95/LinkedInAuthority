# Firebase App Hosting configuration
# See reference: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  concurrency: 80
  minInstances: 0
  cpu: 1
  memoryMiB: 512

env:
  - variable: GEMINI_API_KEY
    secret: gemini_api_key
  - variable: GEMINI_PRO_API_KEY
    secret: gemini_api_key
  - variable: ANALYSIS_SIGNING_SECRET
    secret: analysis_signing_secret
  - variable: CRON_SECRET
    secret: cron_secret
