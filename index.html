          document.documentElement.dir = 'rtl';
        }
        
        var content = {
          en: {
            title: "LinkedIn Authority | Evidence-backed technical drafts",

            ogImage: "/og-image.png"
          }
        };
        
        var lang = isArabic ? 'ar' : 'en';
        window.__LAE_CONTENT__ = content[lang];
        window.__LAE_LANG__ = lang;
      })();
    </script>

    <script>
      // Apply Dynamic Meta Tags
      document.addEventListener('DOMContentLoaded', function() {
        var c = window.__LAE_CONTENT__;
        if(c && window.__LAE_LANG__ === 'ar') {
          document.title = c.title;
          
          var descMeta = document.querySelector('meta[name="description"]');
          if (descMeta) descMeta.setAttribute('content', c.description);
          
          var ogTitle = document.querySelector('meta[property="og:title"]');
          if (ogTitle) ogTitle.setAttribute('content', c.ogTitle);
          
          var ogDesc = document.querySelector('meta[property="og:description"]');
          if (ogDesc) ogDesc.setAttribute('content', c.description);
          
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg) ogImg.setAttribute('content', c.ogImage);
          
          var twTitle = document.querySelector('meta[name="twitter:title"]');
          if (twTitle) twTitle.setAttribute('content', c.title);
          
          var twDesc = document.querySelector('meta[name="twitter:description"]');
          if (twDesc) twDesc.setAttribute('content', c.description);
          
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg) twImg.setAttribute('content', c.ogImage);
        }
      });

  <body class="bg-slate-950 font-sans text-slate-100 antialiased selection:bg-indigo-500/30">
    <div id="root"></div>
    <script>
      (function() {
        function showSafeFatalError() {
          if (document.getElementById('app-fatal-error')) return;
          var notice = document.createElement('div');
          notice.id = 'app-fatal-error';
          notice.setAttribute('role', 'alert');
          notice.style.cssText = 'position:fixed; inset:1rem; z-index:9999; display:flex; align-items:center; justify-content:center; padding:2rem; color:#e2e8f0; background:#020617; border:1px solid rgba(129,140,248,.35); border-radius:1rem; font:600 15px/1.6 system-ui,sans-serif; text-align:center;';
          notice.textContent = 'Something went wrong while loading LinkedIn Authority. Please reload and try again.';
          document.body.appendChild(notice);
        }
        window.addEventListener('error', function(e) {
          console.error('Unhandled application error', e.error || e.message);
          showSafeFatalError();
        });
        window.addEventListener('unhandledrejection', function(e) {
          console.error('Unhandled application rejection', e.reason);
          showSafeFatalError();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register the versioned shell worker. It never caches API responses or user data. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(err) {
            // PWA install is optional; a registration failure must not block the app.
            console.warn('Service Worker registration failed:', err);
          });
        });
      }
    </script>
