name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Dependency security audit
      run: npm audit --audit-level=high

    - name: Closed Beta static preflight
      run: npm run closed-beta:preflight
      
    - name: Run Tests
      run: npm test
      env:
        NODE_ENV: test
        ANALYSIS_SIGNING_SECRET: "test-secret-key-for-ci"

    - name: Firestore Rules Emulator Tests
      run: npm run test:rules

    - name: Typecheck
      run: npm run typecheck

    - name: Production build
      run: npm run build

    - name: Production server smoke
      run: npm run test:production-smoke

    - name: Install Chromium for browser E2E
      run: npx playwright install --with-deps chromium

    - name: Browser E2E core journey
      run: npm run test:e2e
